# Local development database only. On Replit, use its built-in Postgres.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: panibook
      POSTGRES_PASSWORD: panibook
      POSTGRES_DB: panibook
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
