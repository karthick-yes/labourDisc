<!doctype html>
<html lang="ml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c8102e" />
    <title>PaniBook</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #eef0f3; color: #111; }
      header { background: #c8102e; color: #fff; padding: 20px 16px; font-weight: 800; font-size: 28px; }
      main { padding: 24px 16px; max-width: 28rem; margin: 0 auto; }
      .board { background: #ffc72c; border: 2px solid #111; border-radius: 10px; padding: 14px; font-size: 20px; font-weight: 800; }
      p { font-size: 17px; line-height: 1.5; }
      button { width: 100%; min-height: 56px; border: 2px solid #111; border-radius: 10px; background: #111; color: #fff; font-size: 18px; font-weight: 700; }
    </style>
  </head>
  <body>
    <header>PaniBook</header>
    <main>
      <div class="board">ഇന്റർനെറ്റ് ഇല്ല · No internet</div>
      <p>കണക്ഷൻ കിട്ടുമ്പോൾ വീണ്ടും ശ്രമിക്കുക. ടൈപ്പ് ചെയ്ത ഫോമുകൾ ഈ ഫോണിൽ സേവ് ആയിട്ടുണ്ട്.</p>
      <p>Try again when you have a connection. Forms you were filling are saved on this phone.</p>
      <button onclick="location.reload()">വീണ്ടും ശ്രമിക്കുക · Retry</button>
    </main>
  </body>
</html>
